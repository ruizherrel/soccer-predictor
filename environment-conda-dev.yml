name: soccer-predictor
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas~=2.2
  - numpy>=2.0,<3.0
  - scipy~=1.14
  - statsmodels>=0.14.2
  - scikit-learn~=1.5
  - joblib~=1.4
  - pyarrow~=17.0
  - requests~=2.32
  - plotly~=5.24
  - streamlit
  - pytest
  - pip
  - pip:
      - xgboost>=3.4
      - shap>=0.45
      # catboost is backtest-only (see src/soccer_predictor/catboost_model.py) --
      # not in requirements.txt since the deployed Streamlit app never loads it.
      - catboost>=1.2
